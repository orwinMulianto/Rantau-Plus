services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rantau_plus
      POSTGRES_USER: rantau
      POSTGRES_PASSWORD: rantau_dev
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rantau -d rantau_plus]
      interval: 2s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.34.0
    profiles: [auth]
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres_data:
