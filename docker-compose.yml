services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rantau_plus
      POSTGRES_USER: rantau
      POSTGRES_PASSWORD: rantau_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rantau -d rantau_plus]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
